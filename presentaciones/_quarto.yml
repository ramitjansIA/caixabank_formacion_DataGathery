project:
  type: default
  output-dir: _site

format:
  revealjs:
    theme: default
    width: 1600
    height: 900
    margin: 0.06
    slide-number: c/t
    transition: fade
    background-transition: fade
    controls: true
    progress: true
    history: false
    hash: true
    center: false
    code-line-numbers: false
    code-overflow: wrap
    footer: "Python profesional para analítica avanzada · Audit Evidence Copilot"

execute:
  echo: true
  warning: false
  error: false

