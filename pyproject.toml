[project]
name = "bankops-dora-course"
version = "0.1.0"
description = "Material docente ejecutable para Audit Evidence Copilot"
requires-python = ">=3.11,<3.15"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "ipykernel>=6.29,<8",
  "ipywidgets>=8.1,<9",
  "jupyter>=1.1,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.3,<6"]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["TRY004"]

[tool.ruff.lint.per-file-ignores]
"scripts/legacy_build_presentations.py" = ["C408", "E501"]
"scripts/legacy_build_notebooks.py" = ["E501"]
